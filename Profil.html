<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - Tchatchibara School</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav>
        <div class="logo">Tchatchibara <span>School</span></div>
        <div class="nav-links">
            <a href="index.html">🏠 Accueil</a>
            <a href="cours.html">📚 Cours</a>
            <a href="profil.html" class="active">👤 Profil</a>
            <a href="compte.html" class="btn-compte">Créer un compte</a>
        </div>
    </nav>

    <section style="padding-top: 60px;">
        <h2 class="section-title">Mon Profil</h2>

        <div class="profil-card">
            <div class="avatar" id="avatar">?</div>
            <h2 id="profilNom">Invité</h2>
            <p class="email" id="profilEmail">Connectez-vous pour voir votre profil</p>

            <div class="profil-stats">
                <div class="stat">
                    <h4 id="statCours">0</h4>
                    <p>Cours consultés</p>
                </div>
                <div class="stat">
                    <h4 id="statPdf">0</h4>
                    <p>PDF téléchargés</p>
                </div>
                <div class="stat">
                    <h4 id="statNiveau">-</h4>
                    <p>Niveau</p>
                </div>
            </div>

            <br>
            <a href="compte.html" class="btn-principal" style="display:block;">Modifier / Créer un compte</a>
        </div>
    </section>

    <footer>
        &copy; 2025 <span>Tchatchibara School</span> — Tous droits réservés.
    </footer>

    <script src="script.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => mettreAJourProfil());
    </script>
</body>
</html>
