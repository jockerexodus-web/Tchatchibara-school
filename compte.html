<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e3c72">
    <title>Compte - Tchatchibara School</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="app">
        <div class="page active">
            <header class="app-header">
                <h2 class="header-title">🔐 Mon Compte</h2>
            </header>

            <div class="compte-form">
                <div class="form-card-app">
                    <h3>Créer un compte</h3>
                    <form onsubmit="creerCompte(event)">
                        <input type="text" id="signupNom" placeholder="Nom complet" required>
                        <input type="email" id="signupEmail" placeholder="Adresse email" required>
                        <input type="password" id="signupPassword" placeholder="Mot de passe (min. 6 car.)" required minlength="6">
                        <select id="signupNiveau">
                            <option value="">-- Choisir votre niveau --</option>
                            <option value="2nde">2nde</option>
                            <option value="1ère">1ère</option>
                            <option value="Terminale">Terminale</option>
                        </select>
                        <button type="submit">S'inscrire</button>
                    </form>
                </div>

                <div class="form-card-app">
                    <h3>Se connecter</h3>
                    <form onsubmit="connexion(event)">
                        <input type="email" id="loginEmail" placeholder="Adresse email" required>
                        <input type="password" id="loginPassword" placeholder="Mot de passe" required>
                        <button type="submit">Se connecter</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="icon">🏠</span><span class="label">Accueil</span>
        </a>
        <a href="index.html#cours" class="nav-item" onclick="localStorage.setItem('goCours','1')">
            <span class="icon">📚</span><span class="label">Cours</span>
        </a>
        <a href="index.html#profil" class="nav-item" onclick="localStorage.setItem('goProfil','1')">
            <span class="icon">👤</span><span class="label">Profil</span>
        </a>
    </nav>

    <script src="script.js"></script>
    <script>
        function creerCompte(event) {
            event.preventDefault();
            const nom = document.getElementById("signupNom").value.trim();
            const email = document.getElementById("signupEmail").value.trim();
            const password = document.getElementById("signupPassword").value;
            const niveau = document.getElementById("signupNiveau").value;
            if (!nom || !email || !password) { alert("❌ Remplissez tous les champs."); return; }
            localStorage.setItem("tchatchibara_user", JSON.stringify({ nom, email, password, niveau }));
            alert(`🎉 Bienvenue ${nom} !`);
            window.location.href = "index.html#profil";
        }

        function connexion(event) {
            event.preventDefault();
            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value;
            const sauvegarde = localStorage.getItem("tchatchibara_user");
            if (!sauvegarde) { alert("❌ Aucun compte. Créez-en un."); return; }
            const compte = JSON.parse(sauvegarde);
            if (compte.email === email && compte.password === password) {
                alert(`✅ Bienvenue ${compte.nom} !`);
                window.location.href = "index.html#profil";
            } else {
                alert("❌ Email ou mot de passe incorrect.");
            }
        }
    </script>
</body>
</html>
